<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 262" width="700" font-family="inherit" font-size="14">
  <defs>
    <marker id="f22a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b42318"/>
    </marker>
    <marker id="f22b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <!-- arrows: the miss at t2 flows back -->
  <path d="M 372 96 C 352 70, 262 70, 242 96" fill="none" stroke="#b42318" stroke-width="1.6" marker-end="url(#f22a)"/>
  <text x="307" y="64" text-anchor="middle" fill="#b42318">× 0.72</text>
  <path d="M 392 96 C 352 24, 122 24, 92 96" fill="none" stroke="#b42318" stroke-width="1.6" marker-end="url(#f22a)"/>
  <text x="240" y="32" text-anchor="middle" fill="#b42318">× 0.72²</text>

  <!-- cells of env 1 -->
  <g text-anchor="middle">
    <rect x="30" y="100" width="124" height="62" rx="6" fill="#ffffff" stroke="#37474f" stroke-width="1.2"/>
    <text x="92" y="122" fill="#6e7781" font-size="12.5">e1 t0</text>
    <text x="92" y="146">δ<tspan dy="4" font-size="10.5">0</tspan><tspan dy="-4"> = −0.70</tspan></text>

    <rect x="180" y="100" width="124" height="62" rx="6" fill="#ffffff" stroke="#37474f" stroke-width="1.2"/>
    <text x="242" y="122" fill="#6e7781" font-size="12.5">e1 t1</text>
    <text x="242" y="146">δ<tspan dy="4" font-size="10.5">1</tspan><tspan dy="-4"> = −0.10</tspan></text>

    <rect x="330" y="100" width="124" height="62" rx="6" fill="#fdecea" stroke="#b42318" stroke-width="1.6"/>
    <text x="392" y="122" fill="#b42318" font-size="12.5">e1 t2 · ล้ม (done = 1)</text>
    <text x="392" y="146" font-weight="bold">δ<tspan dy="4" font-size="10.5">2</tspan><tspan dy="-4"> = −3.00</tspan></text>

    <rect x="546" y="100" width="124" height="62" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
    <text x="608" y="122" fill="#6e7781" font-size="12.5">e1 t3 · episode ใหม่</text>
    <text x="608" y="146">δ<tspan dy="4" font-size="10.5">3</tspan><tspan dy="-4"> = −0.85</tspan></text>
  </g>

  <!-- the mask wall -->
  <line x1="500" y1="40" x2="500" y2="236" stroke="#37474f" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="500" y="30" text-anchor="middle" font-weight="bold">mask = 0</text>
  <path d="M 544 131 L 508 131" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#f22b)"/>
  <text x="480" y="136" text-anchor="middle" fill="#8c959f" font-size="16">✕</text>

  <!-- results -->
  <g text-anchor="middle">
    <text x="92" y="190" fill="#6e7781" font-size="12.5">−0.70 − 0.072 − 1.5552</text>
    <text x="92" y="214" font-weight="bold" fill="#0f6e6e">A<tspan dy="4" font-size="10.5">0</tspan><tspan dy="-4"> = −2.3272</tspan></text>
    <text x="242" y="190" fill="#6e7781" font-size="12.5">−0.10 − 2.16</text>
    <text x="242" y="214" font-weight="bold" fill="#0f6e6e">A<tspan dy="4" font-size="10.5">1</tspan><tspan dy="-4"> = −2.2600</tspan></text>
    <text x="392" y="190" fill="#6e7781" font-size="12.5">−3.00</text>
    <text x="392" y="214" font-weight="bold" fill="#0f6e6e">A<tspan dy="4" font-size="10.5">2</tspan><tspan dy="-4"> = −3.0000</tspan></text>
    <text x="608" y="190" fill="#6e7781" font-size="12.5">−0.85</text>
    <text x="608" y="214" font-weight="bold" fill="#0f6e6e">A<tspan dy="4" font-size="10.5">3</tspan><tspan dy="-4"> = −0.8500</tspan></text>
  </g>
</svg>
