<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actor-Critic บน Tron1 · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@400&display=swap" rel="stylesheet">
  <script src="mathjax/tex-svg.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans Thai', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif Thai', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Thai', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    /* --- MathJax-in-SVG: math labels live in foreignObject --- */
    foreignObject { overflow: visible; }
    .fo {
      display: block; width: 100%; height: 100%;
      text-align: center; white-space: nowrap;
      font-family: var(--font-mono);
    }
    .fo.left  { text-align: left; }
    .fo.right { text-align: right; }
    .fo mjx-container { margin: 0 !important; display: inline-block !important; }
    .fo .tx { font-family: var(--font-mono); }
    .fo .th { font-family: var(--font-sans); }
    .name {
      font-family: var(--font-sans); font-weight: 600; font-size: 12px; color: var(--color-ink);
    }
    .name .tx { font-family: var(--font-sans); }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Tron1 RL · โน้ต 05 ภาค 2 และ 4</p>
    <h1>Actor-Critic บน Tron1 — โครงสร้างของการเรียนรู้</h1>
    <p class="sub">แบบแผนเดียวกับรูป agent–environment ของ Sutton &amp; Barto: สถานะและรางวัลไหลขึ้นทางซ้าย action ไหลลงทางขวา
      ลูกศรทุกเส้นคือสัญลักษณ์ที่โน้ต 05 นิยามไว้ · เส้นประ = ใช้เฉพาะตอนเทรน ถูกทิ้งตอน deploy</p>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tron1-actor-critic-title tron1-actor-critic-desc">
      <title id="tron1-actor-critic-title">Actor-Critic บน Tron1 — โครงสร้างของการเรียนรู้</title>
      <desc id="tron1-actor-critic-desc">แผนภาพสถาปัตยกรรม actor-critic ของ Tron1: environment ส่ง state และ reward ขึ้นไปยัง actor, critic และ GAE; critic ประเมินค่า state, GAE คำนวณ advantage ส่งให้ PPO ซึ่งปรับ weight ของ actor และ critic; actor ส่ง action กลับลงมายัง environment ครบวงจร</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: AGENT (drawn before arrows and nodes) -->
      <rect x="112" y="80" width="776" height="272" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="476" y="84" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">AGENT</text>

      <!-- ===== Arrows first (behind boxes) ===== -->
      <!-- 1. Env → Actor : s_t (obs 36 + cmd 3 + hist 360) — up the left side -->
      <line x1="176" y1="424" x2="176" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 2. Actor → Env : a_t — down, closes the agent–environment loop -->
      <line x1="280" y1="192" x2="280" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 3. Env → Critic : privileged state 227 + cmd 3 — up the right side -->
      <line x1="816" y1="424" x2="816" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 4. Env → GAE : r_t -->
      <line x1="648" y1="424" x2="648" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 5. Critic → GAE : V(s_t) -->
      <line x1="712" y1="192" x2="712" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 6. GAE → PPO : A_t  (focal — credit assignment) -->
      <line x1="568" y1="288" x2="512" y2="288" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- 7. PPO → Actor : ∇θ (dashed = learning signal) — exits PPO top, enters Actor right edge -->
      <path d="M 400,248 V 160 Q 400,152 392,152 H 312"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- 8. PPO → Critic : ∇φ (dashed) — exits PPO top, enters Critic left edge -->
      <path d="M 464,248 V 160 Q 464,152 472,152 H 688"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ===== Arrow labels (opaque mask + 6–10px gap from stroke) ===== -->
      <rect x="136" y="300" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <foreignObject x="134" y="298.12" width="36" height="16"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:8px;color:#4f5d75;line-height:16px;">\(s_t\)</div></foreignObject>

      <rect x="288" y="300" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <foreignObject x="286" y="298.12" width="36" height="16"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:8px;color:#4f5d75;line-height:16px;">\(a_t\)</div></foreignObject>

      <rect x="824" y="300" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <foreignObject x="824" y="298.12" width="60" height="16"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:8px;color:#4f5d75;line-height:16px;">\(s_t^{\mathrm{priv}}\)</div></foreignObject>

      <rect x="656" y="368" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <foreignObject x="654" y="366.12" width="36" height="16"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:8px;color:#4f5d75;line-height:16px;">\(r_t\)</div></foreignObject>

      <rect x="720" y="214" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <foreignObject x="720" y="212.12" width="48" height="16"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:8px;color:#4f5d75;line-height:16px;">\(V(s_t)\)</div></foreignObject>

      <rect x="524" y="268" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <foreignObject x="522" y="266.12" width="36" height="16"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:8px;color:#eb6c36;line-height:16px;">\(A_t\)</div></foreignObject>

      <rect x="336" y="132" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <foreignObject x="334" y="130.12" width="36" height="16"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:8px;color:#4f5d75;line-height:16px;">\(\nabla_\theta\)</div></foreignObject>

      <rect x="564" y="132" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <foreignObject x="562" y="130.12" width="36" height="16"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:8px;color:#4f5d75;line-height:16px;">\(\nabla_\phi\)</div></foreignObject>

      <!-- ===== Nodes ===== -->

      <!-- Actor π_θ — deployed network (solid ink) -->
      <rect x="136" y="112" width="176" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="136" y="112" width="176" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="144" y="120" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="164" y="129" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACTOR</text>
      <text x="224" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans Thai', sans-serif" text-anchor="middle">Actor · ตัวตัดสินใจ</text>
      <foreignObject x="136" y="152.76" width="176" height="16"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:8px;color:#4f5d75;line-height:16px;">\(\pi_\theta(a\mid s)\)<span class="tx">&#160;·&#160;</span>\(42\!\to\!512\!\to\!256\!\to\!128\!\to\!\mu\,(8)\)</div></foreignObject>
      <foreignObject x="136" y="168.76" width="176" height="16"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:9px;color:#7a8399;line-height:16px;">\(\mathrm{enc}\,360\!\to\!3\ \oplus\ \mathrm{obs}\,36\ \oplus\ \mathrm{cmd}\,3\)</div></foreignObject>

      <!-- Critic V_φ — training-only (dashed) -->
      <rect x="688" y="112" width="176" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="688" y="112" width="176" height="80" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="696" y="120" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="718" y="129" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRITIC</text>
      <text x="776" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans Thai', sans-serif" text-anchor="middle">Critic · ตัวประเมิน</text>
      <foreignObject x="688" y="152.76" width="176" height="16"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:9px;color:#4f5d75;line-height:16px;">\(V_\phi(s)\)<span class="tx">&#160;·&#160;</span>\(230\!\to\!512\!\to\!256\!\to\!128\!\to\!1\)</div></foreignObject>
      <text x="776" y="180" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">privileged · training only</text>

      <!-- PPO update — training-only (dashed) -->
      <rect x="352" y="248" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="352" y="248" width="160" height="80" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="360" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="374" y="265" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PPO</text>
      <text x="432" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans Thai', sans-serif" text-anchor="middle">Update · ปรับ θ, φ</text>
      <foreignObject x="352" y="288.76" width="160" height="16"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:9px;color:#4f5d75;line-height:16px;">\(L^{\mathrm{CLIP}} + 1.0\,L^{V} - 0.01\,H\)</div></foreignObject>
      <text x="432" y="316" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Adam · 20 steps / iteration</text>

      <!-- GAE → A_t — FOCAL (the critic's signal to the actor) -->
      <rect x="568" y="248" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="248" width="160" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="576" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="590" y="265" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GAE</text>
      <text x="648" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans Thai', sans-serif" text-anchor="middle">Advantage · เครดิต</text>
      <foreignObject x="568" y="288.76" width="160" height="16"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:9px;color:#4f5d75;line-height:16px;">\(\delta_t = r_t + \gamma V_{t+1} - V_t\)</div></foreignObject>
      <foreignObject x="568" y="304.76" width="160" height="16"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:9px;color:#7a8399;line-height:16px;">\(A_t=\sum_{k\ge 0}(\gamma\lambda)^k\,\delta_{t+k}\)</div></foreignObject>

      <!-- Environment — external -->
      <rect x="136" y="424" width="728" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="136" y="424" width="728" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="144" y="432" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="158" y="441" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENV</text>
      <text x="500" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans Thai', sans-serif" text-anchor="middle">Environment · PhysX × 2048 envs · 50 Hz</text>
      <text x="500" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">action×0.25 → PD 200 Hz → physics → 20 reward terms · domain randomization</text>
      <foreignObject x="136" y="480.76" width="728" height="16"><div xmlns="http://www.w3.org/1999/xhtml" class="fo" style="font-size:9px;color:#7a8399;line-height:16px;">\(s_t=\{\mathrm{obs}\,36,\ \mathrm{cmd}\,3,\ \mathrm{hist}\,360\}\)<span class="tx">&#160;·&#160;</span>\(s_t^{\mathrm{priv}}=\{227+\mathrm{cmd}\,3\}\)</div></foreignObject>

      <!-- ===== Legend strip ===== -->
      <line x1="40" y1="524" x2="960" y2="524" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="552" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="561" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans Thai', sans-serif">Advantage — สัญญาณที่ critic ใช้สอน actor (แก่นของ actor-critic)</text>

      <rect x="440" y="552" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="460" y="561" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans Thai', sans-serif">Network ที่ถูก deploy ลงหุ่นจริง</text>

      <rect x="720" y="552" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="740" y="561" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans Thai', sans-serif">ใช้ตอนเทรนเท่านั้น — ทิ้งตอน deploy</text>

      <rect x="40" y="576" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="60" y="585" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans Thai', sans-serif">Environment (ซิมูเลเตอร์)</text>

      <line x1="280" y1="581" x2="308" y2="581" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="316" y="585" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans Thai', sans-serif">ข้อมูลไหลไปข้างหน้า (forward)</text>

      <line x1="540" y1="581" x2="568" y2="581" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="576" y="585" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans Thai', sans-serif">gradient — สัญญาณการเรียนรู้</text>

      <line x1="800" y1="581" x2="828" y2="581" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="836" y="585" fill="#4f5d75" font-size="10" font-family="'Geist', 'Noto Sans Thai', sans-serif">credit assignment</text>
    </svg>
  </div>
</body>
